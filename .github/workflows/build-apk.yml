name: Build HandelDesk Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Patch alpha build
        shell: bash
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          sed -i '/composeBom/d' app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.11.0/' app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.9.4/' app/build.gradle.kts
          sed -i 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.9.4/' app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.9.4/' app/build.gradle.kts
          sed -i 's/navigation-compose:2.10.2/navigation-compose:2.9.8/' app/build.gradle.kts
          sed -i 's|"androidx.compose.material3:material3"|"androidx.compose.material3:material3:1.3.2"|' app/build.gradle.kts
          sed -i 's|"androidx.compose.foundation:foundation"|"androidx.compose.foundation:foundation:1.9.4"|' app/build.gradle.kts
          sed -i 's|"androidx.compose.ui:ui"|"androidx.compose.ui:ui:1.9.4"|' app/build.gradle.kts
          sed -i 's|"androidx.compose.ui:ui-tooling-preview"|"androidx.compose.ui:ui-tooling-preview:1.9.4"|' app/build.gradle.kts
          sed -i 's|"androidx.compose.ui:ui-tooling"|"androidx.compose.ui:ui-tooling:1.9.4"|' app/build.gradle.kts
          sed -i 's|"androidx.compose.ui:ui-test-junit4"|"androidx.compose.ui:ui-test-junit4:1.9.4"|' app/build.gradle.kts
          sed -i 's|"androidx.compose.ui:ui-test-manifest"|"androidx.compose.ui:ui-test-manifest:1.9.4"|' app/build.gradle.kts

          BRIDGE=app/src/main/java/de/handeltheke/handeldesk/data/remote/BridgeClient.kt
          SEARCH=app/src/main/java/de/handeltheke/handeldesk/data/repo/ProductSearchRepository.kt
          SCREEN=app/src/main/java/de/handeltheke/handeldesk/ui/screens/ProductScreen.kt

          sed -i 's/throw@withContext BridgeException/throw BridgeException/g' "$BRIDGE"
          perl -0pi -e 's/\n        parsed\n    }\n\n    private fun buildUrl/\n        return parsed\n    }\n\n    private fun buildUrl/' "$BRIDGE"
          sed -i 's/args += values/args.addAll(values)/g' "$SEARCH"
          sed -i '0,/@Composable/s//@OptIn(ExperimentalMaterial3Api::class)\n@Composable/' "$SCREEN"

          grep -q 'return parsed' "$BRIDGE"
          grep -q 'args.addAll(values)' "$SEARCH"
          grep -q 'OptIn(ExperimentalMaterial3Api' "$SCREEN"

      - name: Build debug APK
        working-directory: HandelDesk_Android_v0.1.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandelDesk-Android-v0.1.0-alpha-debug
          path: HandelDesk_Android_v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
