name: Build HandelDesk Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.1.7 source patch
        working-directory: HandelDesk_Android_v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          test -f ../HandelDesk-v0.1.7-source-patch.tgz
          tar -xzf ../HandelDesk-v0.1.7-source-patch.tgz
          grep -q 'versionName = "0.1.6"' app/build.gradle.kts
          grep -q 'versionCode = 7' app/build.gradle.kts
          grep -q 'Поиск по названию' app/src/main/java/de/handeltheke/handeldesk/ui/screens/ProductScreen.kt
          grep -q 'Добавить опцию' app/src/main/java/de/handeltheke/handeldesk/ui/screens/ProductScreen.kt
          grep -q 'result\["id_map"\] as? JsonObject' app/src/main/java/de/handeltheke/handeldesk/data/repo/SyncRepository.kt
          grep -q 'deleteLocalProduct' app/src/main/java/de/handeltheke/handeldesk/data/repo/ProductEditorRepository.kt
          grep -q 'Удалить локальный товар' app/src/main/java/de/handeltheke/handeldesk/ui/screens/ProductScreen.kt

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HANDELDESK_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HANDELDESK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "Missing GitHub Actions secrets HANDELDESK_KEYSTORE_B64 / HANDELDESK_KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/HandelDesk-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/HandelDesk-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias handeldesk >/dev/null

      - name: Build stable release APK
        working-directory: HandelDesk_Android_v0.1.0
        env:
          HANDELDESK_KEYSTORE_FILE: ${{ runner.temp }}/HandelDesk-release.jks
          HANDELDESK_KEYSTORE_PASSWORD: ${{ secrets.HANDELDESK_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK and permanent certificate
        working-directory: HandelDesk_Android_v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          test "$CERT" = "51703557bf7c40156bf6094019c036b95f135d31ded7f86babc569c5d57839da"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandelDesk-Android-v0.1.7-stable
          path: HandelDesk_Android_v0.1.0/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
