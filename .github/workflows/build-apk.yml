name: Build HandelDesk Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.1.4 source patch
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          test -f ../HandelDesk-v0.1.4-source-patch.tgz
          rm -f bridge/OpenCart_Bridge_v*.ocmod.zip
          tar -xzf ../HandelDesk-v0.1.4-source-patch.tgz
          grep -q 'versionName = "0.1.4"' app/build.gradle.kts
          grep -q 'OP_VERIFY_PHOTOS' app/src/main/java/de/handeltheke/handeldesk/worker/OfflinePrepareService.kt
          test -f bridge/OpenCart_Bridge_v0.4.4.ocmod.zip

      - name: Restore persistent HandelDesk signing key
        shell: bash
        env:
          HANDELDESK_DEBUG_KEYSTORE_B64: ${{ secrets.HANDELDESK_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$HANDELDESK_DEBUG_KEYSTORE_B64" || {
            echo "Missing GitHub Actions secret: HANDELDESK_DEBUG_KEYSTORE_B64"
            exit 1
          }
          printf '%s' "$HANDELDESK_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/handeldesk-debug.jks"
          chmod 600 "$RUNNER_TEMP/handeldesk-debug.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/handeldesk-debug.jks" \
            -storepass android \
            -alias androiddebugkey

      - name: Force persistent signing config
        shell: bash
        env:
          HANDELDESK_KEYSTORE_PATH: ${{ runner.temp }}/handeldesk-debug.jks
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          marker = "    buildFeatures {\n"
          block = (
              '    signingConfigs {\n'
              '        create("handeldeskPersistentDebug") {\n'
              '            storeFile = file(System.getenv("HANDELDESK_KEYSTORE_PATH"))\n'
              '            storePassword = "android"\n'
              '            keyAlias = "androiddebugkey"\n'
              '            keyPassword = "android"\n'
              '        }\n'
              '    }\n\n'
              '    buildTypes {\n'
              '        getByName("debug") {\n'
              '            signingConfig = signingConfigs.getByName("handeldeskPersistentDebug")\n'
              '        }\n'
              '    }\n\n'
          )

          if "handeldeskPersistentDebug" not in s:
              if marker not in s:
                  raise SystemExit("Could not find insertion point in app/build.gradle.kts")
              s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding="utf-8")
          PY

          grep -q 'handeldeskPersistentDebug' app/build.gradle.kts

      - name: Build debug APK
        working-directory: HandelDesk_Android_v0.1.0
        env:
          HANDELDESK_KEYSTORE_PATH: ${{ runner.temp }}/handeldesk-debug.jks
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and permanent signer
        working-directory: HandelDesk_Android_v0.1.0
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

          CERT_SHA=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')

          EXPECTED="80a948afa1dbd674f6acac663f2412aa842811dbe9898dc0d6c4c430daf7fc16"

          echo "APK signer: $CERT_SHA"

          test "$CERT_SHA" = "$EXPECTED" || {
            echo "Unexpected APK signer: $CERT_SHA"
            exit 1
          }

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandelDesk-Android-v0.1.4-alpha-stable-signed
          path: HandelDesk_Android_v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
