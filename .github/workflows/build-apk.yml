name: Build HandelDesk Android Hotfix2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.1.4-hotfix2 source patch
        working-directory: HandelDesk_Android_v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          test -f ../HandelDesk-v0.1.4-hotfix2-source-patch.tgz
          tar -xzf ../HandelDesk-v0.1.4-hotfix2-source-patch.tgz
          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "0.1.4-hotfix2"' app/build.gradle.kts
          grep -q 'ПРОВЕРИТЬ OFFLINE API' app/src/main/java/de/handeltheke/handeldesk/ui/screens/SettingsScreen.kt
          grep -q 'BridgeNetworkException' app/src/main/java/de/handeltheke/handeldesk/data/remote/BridgeClient.kt
          grep -q 'Проверка Offline API перед очисткой' app/src/main/java/de/handeltheke/handeldesk/worker/OfflinePrepareService.kt

      - name: Restore persistent HandelDesk signing key
        shell: bash
        env:
          HANDELDESK_DEBUG_KEYSTORE_B64: ${{ secrets.HANDELDESK_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$HANDELDESK_DEBUG_KEYSTORE_B64" || {
            echo "Missing GitHub Actions secret: HANDELDESK_DEBUG_KEYSTORE_B64"
            exit 1
          }
          printf '%s' "$HANDELDESK_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/handeldesk-debug.jks"
          chmod 600 "$RUNNER_TEMP/handeldesk-debug.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/handeldesk-debug.jks" \
            -storepass android \
            -alias androiddebugkey

      - name: Force persistent signing config
        shell: bash
        env:
          HANDELDESK_KEYSTORE_PATH: ${{ runner.temp }}/handeldesk-debug.jks
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          marker = "    buildFeatures {\n"
          block = (
              '    signingConfigs {\n'
              '        create("handeldeskPersistentDebug") {\n'
              '            storeFile = file(System.getenv("HANDELDESK_KEYSTORE_PATH"))\n'
              '            storePassword = "android"\n'
              '            keyAlias = "androiddebugkey"\n'
              '            keyPassword = "android"\n'
              '        }\n'
              '    }\n\n'
              '    buildTypes {\n'
              '        getByName("debug") {\n'
              '            signingConfig = signingConfigs.getByName("handeldeskPersistentDebug")\n'
              '        }\n'
              '    }\n\n'
          )

          if "handeldeskPersistentDebug" not in s:
              if marker not in s:
                  raise SystemExit("Could not find insertion point in app/build.gradle.kts")
              s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding="utf-8")
