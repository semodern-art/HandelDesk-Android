name: Build HandelDesk Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Apply v0.1.3 source patch
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          test -f ../HandelDesk-v0.1.3-source-patch.tgz
          tar -xzf ../HandelDesk-v0.1.3-source-patch.tgz
          sed -i 's/import androidx.core.app.ContextCompat/import androidx.core.content.ContextCompat/' app/src/main/java/de/handeltheke/handeldesk/worker/OfflinePrepareService.kt
          grep -q 'versionName = "0.1.3"' app/build.gradle.kts
          grep -q 'import androidx.core.content.ContextCompat' app/src/main/java/de/handeltheke/handeldesk/worker/OfflinePrepareService.kt
          grep -q 'OfflinePrepareService' app/src/main/java/de/handeltheke/handeldesk/ui/screens/PrepareOfflineScreen.kt
          grep -q 'full_snapshot_after_id' app/src/main/java/de/handeltheke/handeldesk/data/repo/SnapshotRepository.kt
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: HandelDesk_Android_v0.1.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: HandelDesk_Android_v0.1.0
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandelDesk-Android-v0.1.3-alpha-debug
          path: HandelDesk_Android_v0.1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
